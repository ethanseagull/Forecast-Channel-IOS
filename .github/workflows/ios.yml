# Builds the iOS app on a macOS runner and uploads an unsigned .ipa (the
# sideloading tool signs it). No Nintendo data is in the repository: the decomp
# is source only. The user's channel files and texture packs come either from
# the Files app at run time or, when this private repo's "data" release has
# forecast-data.zip (tools/pack_data.ps1), from the bundle.
name: iOS

permissions:
  contents: read

on:
  push:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: brew install glslang spirv-cross

      - name: Decomp source (doldecomp/forecast + the port's patch)
        run: |
          git clone --quiet https://github.com/doldecomp/forecast.git forecast-decomp
          git -C forecast-decomp checkout --quiet 92a5782
          # The patch is kept with a BOM and CRLF line ends (Windows tools).
          sed -e '1s/^\xEF\xBB\xBF//' -e 's/\r$//' patches/decomp-port.patch > "$RUNNER_TEMP/decomp-port.patch"
          git -C forecast-decomp apply --whitespace=nowarn "$RUNNER_TEMP/decomp-port.patch"

      - name: SDL3 source
        run: git clone --quiet --depth 1 --branch release-3.4.20 https://github.com/libsdl-org/SDL.git "$RUNNER_TEMP/SDL"

      - name: Metal shaders
        run: sh tools/build_shaders_msl.sh build-ios/generated ios

      # The app generates specialized TEV pixel shaders as MSL at run time
      # (port/gx/gx_tevgen.cpp); nothing compiles them at build time. Generate
      # the ones the channel is known to use (tools/tevgen/keys.txt) plus
      # random ones, compile each with Apple's compiler, and link them with
      # the ubershader's vertex shader into pipelines where the runner has a
      # Metal device.
      - name: Specialized shaders (compile and link check)
        run: |
          t="$RUNNER_TEMP/tevgen"
          mkdir -p "$t"
          # The interface the generated shaders must match (in the log).
          sed -n '/^struct main0_out/,/^};/p' build-ios/generated/gx_vs.metal
          sed -n '/^struct main0_in/,/^};/p' build-ios/generated/gx_ps.metal
          clang++ -std=c++14 -O1 -Iport/gx tools/tevgen/samples.cpp port/gx/gx_tevgen.cpp -o "$t/samples"
          "$t/samples" tools/tevgen/keys.txt "$t" 40
          if ! xcrun -sdk iphoneos metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain || true
          fi
          if xcrun -sdk iphoneos metal --version >/dev/null 2>&1; then
            ls "$t"/*.metal | xargs -P 4 -I{} sh -c 'xcrun -sdk iphoneos metal -c "{}" -o "{}.air" || { echo "FAILED: {}"; exit 255; }'
            echo "All $(ls "$t"/*.metal | wc -l) specialized shader samples compile."
          else
            echo "::warning::Metal compiler not available: specialized shader samples not compiled"
          fi
          xcrun swift tools/tevgen/link_check.swift build-ios/generated/gx_vs.metal build-ios/generated/gx_ps.metal "$t"/*.metal

      - name: Configure
        run: >
          cmake -S . -B build-ios -G Xcode
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          -DFORECAST_SDL_SOURCE="$RUNNER_TEMP/SDL"
          -DFORECAST_MSL_DIR="$PWD/build-ios/generated"

      - name: Build
        run: >
          cmake --build build-ios --config Release --
          -sdk iphoneos CODE_SIGNING_ALLOWED=NO -quiet

      # The user's channel files and texture packs (tools/pack_data.ps1), kept
      # as the asset of this private repo's "data" release, never in git: with
      # them in the bundle the app needs no Files app. Without the asset the
      # .ipa is the plain one (the user copies the files into Documents).
      - name: Channel files and texture packs (private release asset)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          app=$(find build-ios -type d -name ForecastOS.app -path '*Release-iphoneos*' | head -1)
          test -n "$app"
          if gh release download data --repo "$GITHUB_REPOSITORY" --pattern forecast-data.zip --dir "$RUNNER_TEMP"; then
            unzip -q "$RUNNER_TEMP/forecast-data.zip" -d "$app"
            rm "$RUNNER_TEMP/forecast-data.zip"
            du -sh "$app/channel" "$app/textures" 2>/dev/null || true
            # The home screen icon (icon/AppIcon.png, 1024x1024, and an
            # iOS 18 dark version), compiled into the bundle by actool.
            if [ -f "$app/icon/AppIcon.png" ]; then
              set -o pipefail
              cat="$RUNNER_TEMP/Assets.xcassets"
              set="$cat/AppIcon.appiconset"
              mkdir -p "$set"
              echo '{"info":{"author":"xcode","version":1}}' > "$cat/Contents.json"
              cp "$app/icon/AppIcon.png" "$set/"
              dark=""
              if [ -f "$app/icon/AppIcon-dark.png" ]; then
                cp "$app/icon/AppIcon-dark.png" "$set/"
                dark=',{"appearances":[{"appearance":"luminosity","value":"dark"}],"filename":"AppIcon-dark.png","idiom":"universal","platform":"ios","size":"1024x1024"}'
              fi
              echo "{\"images\":[{\"filename\":\"AppIcon.png\",\"idiom\":\"universal\",\"platform\":\"ios\",\"size\":\"1024x1024\"}$dark],\"info\":{\"author\":\"xcode\",\"version\":1}}" > "$set/Contents.json"
              rm -r "$app/icon"
              if xcrun actool "$cat" --compile "$app" --platform iphoneos --minimum-deployment-target 15.0 \
                  --app-icon AppIcon --output-partial-info-plist "$RUNNER_TEMP/icon.plist" \
                  --target-device iphone --target-device ipad --output-format human-readable-text; then
                /usr/libexec/PlistBuddy -c "Merge $RUNNER_TEMP/icon.plist" "$app/Info.plist"
                ls "$app" | grep -i -E "appicon|assets.car" || true
              else
                echo "::warning::actool failed: the app keeps the default icon"
              fi
            fi
          else
            echo "::notice::No forecast-data.zip in the data release: a plain .ipa (channel files via the Files app)"
          fi

      - name: Package
        run: |
          app=$(find build-ios -type d -name ForecastOS.app -path '*Release-iphoneos*' | head -1)
          test -n "$app"
          mkdir -p Payload
          cp -R "$app" Payload/
          zip -qry ForecastChannel.ipa Payload
          ls -l ForecastChannel.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ForecastChannel-ipa
          path: ForecastChannel.ipa
          retention-days: 30
